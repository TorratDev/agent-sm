name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # PRs check out a merge commit; its first parent is the base branch.
          fetch-depth: 2
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            printf 'Run gofmt on:\n%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test affected code with race detector
        env:
          # Pushes to main always run the full suite.
          TEST_ALL: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: scripts/test-affected.sh HEAD^1 -- -race
      - name: Build
        run: go build ./...
      - name: Cross-compile and vet every supported platform
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            echo "== $target"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go vet ./...
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null .
          done

  native:
    # The platform files (proc_*, filelock_*) and path handling only run for real on their own OS.
    # Fake-provider tests are sh scripts and skip themselves on Windows.
    name: Tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
